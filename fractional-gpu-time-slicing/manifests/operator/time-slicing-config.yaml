# RHOAI 3.5 Chapter 8 — Enable GPU time slicing
# https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/working_with_accelerators/about-gpu-time-slicing_accelerators
#
# ConfigMap must be named time-slicing-config in the NVIDIA GPU Operator namespace.
# Profile key (a10g) must match ClusterPolicy devicePlugin.config.default and
# the nvidia.com/device-plugin.config node/MachineSet label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: nvidia-gpu-operator
data:
  # GPU-specific profile key (RHOAI docs use tesla-t4 for T4; this cluster uses A10G)
  a10g: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
          - name: nvidia.com/gpu
            replicas: 2
